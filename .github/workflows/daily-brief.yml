name: OPC Daily Brief
on:
  schedule:
    - cron: '0 0 * * *'  # 08:00 Asia/Shanghai (approx.; GitHub scheduled runs can delay)
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate deterministic daily brief
        run: python scripts/daily_ops.py --stdout > daily-brief.md
      - name: Keep one up-to-date operational issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'OPC 每日作战面板';
            const body = fs.readFileSync('daily-brief.md','utf8');
            const p = {owner: context.repo.owner, repo: context.repo.repo};
            const {data: issues} = await github.rest.issues.listForRepo({...p,state:'open',per_page:100});
            const existing = issues.find(issue=>issue.title===title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({...p,issue_number:existing.number,body});
            } else {
              await github.rest.issues.create({...p,title,body});
            }
      - uses: actions/upload-artifact@v4
        with:
          name: daily-brief
          path: daily-brief.md
          retention-days: 30

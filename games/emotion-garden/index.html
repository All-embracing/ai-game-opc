<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#edf6f1" />
<title>七灵·心隅花园 — 玩法验证版</title>
<style>
:root{--ink:#26443d;--green:#2c7764;--bg:#f0f7f3;--paper:#fffdf8;--line:#d5e3db;--soft:#e9f5ef}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 10%,#fff8e7,transparent 40%),linear-gradient(150deg,#eff8f1,#e9f1fb);font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:var(--ink);min-height:100vh}.shell{max-width:960px;margin:0 auto;padding:28px 18px 48px}.hero{text-align:center;margin:10px auto 28px}.eyebrow{letter-spacing:.22em;font-size:11px;color:var(--green);font-weight:800}.hero h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(32px,6vw,52px);font-weight:700;margin:8px}.hero p{color:#647c73;max-width:600px;margin:auto;line-height:1.7}.app{display:grid;grid-template-columns:1fr 320px;gap:22px}.panel{background:rgba(255,253,248,.92);border:1px solid #d6e6dc;box-shadow:0 14px 40px #355e4914;border-radius:26px;padding:22px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.kpi{background:var(--soft);padding:12px;border-radius:14px;text-align:center}.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.kpi span{font-size:12px;color:#628277}.progress{background:#dce8df;height:10px;border-radius:99px;overflow:hidden;margin:10px 0 14px}.bar{width:0;height:100%;background:linear-gradient(90deg,#82c0a4,#32977c);transition:width .25s}.board{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;background:#d6ebde;padding:10px;border-radius:22px;aspect-ratio:1}.tile{border:0;border-radius:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;position:relative;box-shadow:inset 0 -5px #0000000d,0 1px 2px #31503b18;transition:transform .14s,box-shadow .14s;touch-action:manipulation}.tile:hover,.tile:focus-visible{transform:translateY(-2px);outline:3px solid #fff;z-index:2}.tile:active{transform:scale(.92)}.tile span{font-size:clamp(16px,3vw,28px);filter:drop-shadow(0 1px #ffffff88)}.tile[data-kind="sun"]{background:#f6d98b}.tile[data-kind="joy"]{background:#f9b9c5}.tile[data-kind="rest"]{background:#b2c8f2}.tile[data-kind="breeze"]{background:#a5e0c7}.side h2{font-size:16px;margin:3px 0 12px}.spirit{width:100%;background:#fff;border:2px solid var(--line);color:var(--ink);border-radius:13px;padding:11px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;font:inherit}.spirit.active{border-color:#3e9b7c;background:#e7f5ef}.spirit .mark{font-size:25px}.spirit strong{display:block;font-size:14px}.spirit small{display:block;font-size:11px;color:#738a81;margin-top:3px}.tip{padding:14px;background:#f3f7ee;border-radius:15px;font-size:13px;color:#5c7569;line-height:1.6}.garden{display:flex;gap:6px;flex-wrap:wrap;min-height:82px;background:linear-gradient(#ebf4ed,#e2f0e4);border-radius:16px;padding:12px;margin:12px 0}.flower{font-size:24px;animation:rise .4s ease}@keyframes rise{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}button.action{background:var(--green);border:0;border-radius:13px;padding:12px 16px;color:white;font-weight:700;cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.notice{font-size:13px;color:#476f5f;min-height:40px;line-height:1.5;margin:11px 0 0}.foot{text-align:center;color:#738b80;font-size:12px;margin-top:24px;line-height:1.6}@media(max-width:760px){.app{grid-template-columns:1fr}.panel{padding:15px}.board{gap:5px;padding:8px}.tile{border-radius:9px}.hero{margin-top:0}.shell{padding:20px 12px 36px}}
</style>
</head><body><div class="shell"><header class="hero"><div class="eyebrow">A TINY COZY GAME · PLAYABLE PROTOTYPE</div><h1>七灵 · 心隅花园</h1><p>把凌乱的心情，慢慢整理成一座花园。点击相邻的同色光点群（至少两枚），收集能量，种下今日的小花。</p></header>
<div class="app"><main class="panel"><div class="kpis"><div class="kpi"><b id="score">0</b><span>情绪能量</span></div><div class="kpi"><b id="moves">18</b><span>剩余步数</span></div><div class="kpi"><b id="level">1</b><span>花园阶段</span></div></div><div role="progressbar" aria-label="本关目标进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" class="progress" id="progress"><div id="bar" class="bar"></div></div><div id="board" class="board" aria-label="六乘六消除棋盘"></div><div id="notice" class="notice" aria-live="polite">连接同色心情：一次消除得越多，获得的能量越高。</div><div class="actions"><button class="action" id="restart">重新开始本关</button><button class="action" id="next" hidden>进入下一座花园</button></div></main><aside class="panel side"><h2>选择今日陪伴的精灵</h2><button class="spirit active" data-spirit="sun"><span class="mark">☀️</span><span><strong>晴光灵</strong><small>每次消除额外获得 10% 能量</small></span></button><button class="spirit" data-spirit="joy"><span class="mark">✨</span><span><strong>雀跃灵</strong><small>消除 5 枚以上光点获得额外奖励</small></span></button><button class="spirit" data-spirit="rest"><span class="mark">🌙</span><span><strong>酣眠灵</strong><small>开局额外增加两步</small></span></button><h2 style="margin-top:24px">你的情绪花园</h2><div class="garden" id="garden" aria-label="你收集的花朵"></div><div class="tip">本版验证的是“点击 → 消除 → 正反馈 → 花园成长”的核心循环。美术、叙事、支付、用户账号和正式运营功能尚未接入。</div></aside></div><div class="foot">OPC 游戏工作室 · V0.1 · 本地原型，无在线服务、广告或支付。<br/>这是原创玩法验证界面，不是七灵正式角色设计稿。</div></div>
<script>
"use strict";
const W=6, TYPES=["sun","joy","rest","breeze"], ICON={sun:"☀",joy:"✿",rest:"☾",breeze:"❋"};
const el=id=>document.getElementById(id);
const state={board:[],score:0,moves:18,level:1,spirit:"sun",flowers:0,ended:false,won:false};
const sample=()=>TYPES[Math.floor(Math.random()*TYPES.length)];
const target=()=>360+180*(state.level-1);
function groupAt(index){const type=state.board[index],seen=new Set([index]),stack=[index];while(stack.length){const i=stack.pop(),r=Math.floor(i/W),c=i%W;for(const [rr,cc] of [[r-1,c],[r+1,c],[r,c-1],[r,c+1]]){const j=rr*W+cc;if(rr>=0&&rr<W&&cc>=0&&cc<W&&!seen.has(j)&&state.board[j]===type){seen.add(j);stack.push(j);}}}return [...seen];}
function hasMove(){return state.board.some((t,i)=>groupAt(i).length>=2);}
function ensureMove(){for(let attempts=0;attempts<10&&!hasMove();attempts++){state.board=Array.from({length:W*W},sample);}if(!hasMove()){state.board[0]=state.board[1];}}
function collapse(removed){const bad=new Set(removed);for(let c=0;c<W;c++){const kept=[];for(let r=W-1;r>=0;r--){const i=r*W+c;if(!bad.has(i))kept.push(state.board[i]);}for(let r=W-1,k=0;r>=0;r--,k++){state.board[r*W+c]=k<kept.length?kept[k]:sample();}}ensureMove();}
function notice(text){el("notice").textContent=text;}
function save(){try{localStorage.setItem("opc-garden-v01",JSON.stringify({level:state.level,flowers:state.flowers}));}catch(e){}}
function draw(){el("score").textContent=state.score;el("moves").textContent=state.moves;el("level").textContent=state.level;const pct=Math.min(100,Math.round(state.score/target()*100));el("bar").style.width=pct+"%";el("progress").setAttribute("aria-valuenow",String(pct));const board=el("board");board.replaceChildren();state.board.forEach((type,i)=>{const b=document.createElement("button");b.className="tile";b.dataset.kind=type;b.setAttribute("aria-label",`第${Math.floor(i/W)+1}行第${i%W+1}列，${type}心情光点`);b.disabled=state.ended;b.innerHTML=`<span aria-hidden="true">${ICON[type]}</span>`;b.addEventListener("click",()=>play(i));board.appendChild(b);});el("garden").replaceChildren();for(let i=0;i<Math.min(state.flowers,24);i++){const span=document.createElement("span");span.className="flower";span.textContent=["🌼","🌸","🌷","🌿"][i%4];el("garden").appendChild(span);}if(!state.flowers)el("garden").textContent="第一朵花，等你种下……";el("next").hidden=!state.won;}
function play(index){if(state.ended)return;const g=groupAt(index);if(g.length<2){notice("请点选两枚或以上相邻、同色的光点。");return;}let points=g.length*g.length*10;if(state.spirit==="sun")points=Math.round(points*1.1);if(state.spirit==="joy"&&g.length>=5)points+=75;state.score+=points;state.moves--;collapse(g);if(state.score>=target()){state.ended=true;state.won=true;state.flowers++;save();notice(`达成目标！获得 ${points} 能量，花园新开一朵花。`);}else if(state.moves<=0){state.ended=true;state.won=false;notice("这一轮结束。尝试换一位精灵，寻找更大的同色光点群。");}else{notice(`消除 ${g.length} 枚光点，获得 ${points} 能量。继续照顾花园吧。`);}draw();}
function newRound(){state.board=Array.from({length:W*W},sample);ensureMove();state.score=0;state.moves=state.spirit==="rest"?20:18;state.ended=false;state.won=false;draw();notice(`本关目标 ${target()} 点。一次消除更多光点会得到更高分数。`);}
for(const b of document.querySelectorAll(".spirit")){b.addEventListener("click",()=>{state.spirit=b.dataset.spirit;document.querySelectorAll(".spirit").forEach(x=>x.classList.toggle("active",x===b));newRound();});}
el("restart").addEventListener("click",newRound);el("next").addEventListener("click",()=>{if(!state.won)return;state.level++;save();newRound();});
try{const saved=JSON.parse(localStorage.getItem("opc-garden-v01")||"{}");if(Number.isInteger(saved.level)&&saved.level>0&&saved.level<100)state.level=saved.level;if(Number.isInteger(saved.flowers)&&saved.flowers>=0&&saved.flowers<10000)state.flowers=saved.flowers;}catch(e){}
newRound();
</script>
</body></html>
